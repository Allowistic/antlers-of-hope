<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antlers of Hope • Bar & Grill • Porterville, CA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');
        :root { --gold: #d4af77; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .hero { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://picsum.photos/id/1015/2000/1200') center/cover; }
    </style>
</head>
<body class="bg-stone-950 text-stone-100">
    <header class="hero h-screen flex items-center justify-center text-center px-6">
        <div>
            <h1 class="text-6xl font-bold text-white tracking-tighter" style="font-family: 'Playfair Display', serif;">ANTLERS OF HOPE</h1>
            <p class="text-2xl text-amber-300 mt-2">Bar & Grill on the Mighty 190</p>
            <p class="mt-8 text-lg">Porterville, California • Supporting HOPE Inc.</p>
            <a href="#menu" class="mt-12 inline-block bg-amber-300 text-stone-950 px-8 py-4 rounded-full text-lg font-semibold">View Menu</a>
        </div>
    </header>

    <section id="menu" class="py-16 bg-stone-900">
        <div class="max-w-4xl mx-auto px-6">
            <h2 class="text-4xl font-light mb-8">Menu</h2>
            <div id="menu-items" class="space-y-6"></div>
        </div>
    </section>

    <script>
        const menuItems = [
            { name: 'Classic Cheeseburger', price: '$14', desc: 'House ground beef, American cheese' },
            { name: 'Pulled Pork Sandwich', price: '$15', desc: 'Slow smoked with coleslaw' },
            { name: 'Seasonal Salmon', price: '$18', desc: 'Fresh local catch - seasonal special' }
        ];

        function renderMenu() {
            const container = document.getElementById('menu-items');
            container.innerHTML = menuItems.map(item => `
                <div class="bg-stone-800 p-6 rounded-2xl flex justify-between items-center">
                    <div>
                        <h3 class="text-xl">${item.name}</h3>
                        <p class="text-stone-400">${item.desc}</p>
                    </div>
                    <div class="text-2xl font-light text-amber-300">${item.price}</div>
                </div>
            `).join('');
        }
        renderMenu();
    </script>
</body>
</html>
